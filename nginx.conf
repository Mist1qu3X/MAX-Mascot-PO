# Раздача веб-версии ПОшки. Сборка Vite лежит в /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Сайт не для поисковиков: noindex на каждом ответе, включая картинки.
    # Повторяется в каждом location со своим add_header — nginx не
    # наследует заголовки сервера туда, где задан хотя бы один свой.
    # robots.txt с Disallow нет нарочно: запрет обхода не дал бы Google
    # увидеть noindex, и уже найденная ссылка могла бы остаться в выдаче.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Файлы сборки с хешем в имени не меняются — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Сама страница — без кэша, чтобы новый деплой подхватывался сразу.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Глобалы Neutralino отдаёт только десктопная сборка. В вебе вместо
    # 404 в консоли — пустой скрипт.
    location = /__neutralino_globals.js {
        default_type application/javascript;
        return 200 "";
    }
}
