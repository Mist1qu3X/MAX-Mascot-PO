# Раздача веб-версии ПОшки. Сборка Vite лежит в /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Файлы сборки с хешем в имени не меняются — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Сама страница — без кэша, чтобы новый деплой подхватывался сразу.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Глобалы Neutralino отдаёт только десктопная сборка. В вебе вместо
    # 404 в консоли — пустой скрипт.
    location = /__neutralino_globals.js {
        default_type application/javascript;
        return 200 "";
    }
}
